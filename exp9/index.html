<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MongoDB operation explorer</title><link rel="stylesheet" href="../lab.css"></head><body><header><small>23CS2049 - Web Technology Lab | URK24CS1107</small><h1>MongoDB operation explorer</h1></header><main><section><button id="run">Run in a new lab database</button><output id="status">Each run creates a separate database.</output><label>Operation <select id="operation"></select></label><h2 id="title"></h2><pre id="command" style="white-space:pre-wrap"></pre><pre id="result" style="white-space:pre-wrap;font-size:14px"></pre></section></main><script>
let operations = [];
function show() {
  const item = operations[Number(document.querySelector('#operation').value)];
  if (!item) return;
  document.querySelector('#title').textContent = item.title;
  document.querySelector('#command').textContent = item.command;
  document.querySelector('#result').textContent = Array.isArray(item.value) ? item.value.map(row => JSON.stringify(row)).join("\n\n") : JSON.stringify(item.value, null, 2);
}
document.querySelector('#operation').addEventListener('change', show);
document.querySelector('#run').addEventListener('click', async event => {
  event.target.disabled = true;
  try {
    const response = await fetch('/api/shell-demo', {method:'POST'});
    const data = await response.json();
    if (!response.ok) throw new Error(data.message);
    operations = data.results;
    document.querySelector('#status').textContent = 'Executed against MongoDB: ' + data.databaseName;
    const select = document.querySelector('#operation'); select.replaceChildren();
    operations.forEach((item, i) => {
      const option = document.createElement('option'); option.value = i;
      option.textContent = item.title; select.append(option);
    }); show();
  } catch(error) { document.querySelector('#status').textContent = error.message; }
  finally { event.target.disabled = false; }
});
</script></body></html>
