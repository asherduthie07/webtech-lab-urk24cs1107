<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMI calculation exercise | URK24CS1107</title>
<link rel="stylesheet" href="../lab.css">

</head>
<body>
<header><small>23CS2049 - Web Technology Lab | URK24CS1107</small>
<h1>BMI calculation exercise</h1></header>
<main><section>
<label>Weight in kilograms<br><input id="weight" type="number" value="68"></label><label>Height in metres<br><input id="height" type="number" value="1.72"></label><button id="run">Calculate BMI</button><output>BMI: <span id="score">—</span><br>Category: <span id="type">—</span></output><p>Uses the exercise thresholds: below 18; 18 to 25 inclusive; above 25 to 30; above 30.</p>
</section></main>
<script>
document.querySelector('#run').addEventListener('click', () => {
  const weight = Number(document.querySelector('#weight').value);
  const height = Number(document.querySelector('#height').value);
  if (!(weight > 0 && height > 0)) {
    document.querySelector('#score').textContent = 'Enter positive values';
    document.querySelector('#type').textContent = '—';
    return;
  }
  const bmi = weight / height ** 2;
  const category = bmi < 18 ? 'Underweight' : bmi <= 25 ? 'Normal'
    : bmi <= 30 ? 'Overweight' : 'Obese';
  document.querySelector('#score').textContent = bmi.toFixed(2);
  document.querySelector('#type').textContent = category;
});
</script>
</body>
</html>
