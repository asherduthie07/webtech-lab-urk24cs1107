<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student birth year groups | URK24CS1107</title>
<link rel="stylesheet" href="../lab.css">

</head>
<body>
<header><small>23CS2049 - Web Technology Lab | URK24CS1107</small>
<h1>Student birth year groups</h1></header>
<main><section>
<div id="list"></div>
</section></main>
<script>
const students = [
  { name: 'Aditi', regno: 'LAB201', birthYear: 1998 },
  { name: 'Nikhil', regno: 'LAB202', birthYear: 2003 },
  { name: 'Sara', regno: 'LAB203', birthYear: 2000 }
];
for (const student of students) {
  let group;
  if (student.birthYear < 2000) group = 'Born before 2000';
  else if (student.birthYear > 2000) group = 'Born after 2000';
  else group = 'Born in 2000';
  const line = document.createElement('p');
  line.textContent = `${student.name}'s Register Number is ${student.regno}. ` +
    `${group} (${student.birthYear}).`;
  document.querySelector('#list').append(line);
}
</script>
</body>
</html>
