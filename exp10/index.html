<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registration | URK24CS1107</title><link rel="stylesheet" href="../lab.css"></head>
<body><header><small>23CS2049 - Web Technology Lab | URK24CS1107</small>
<h1>User registration</h1></header><main><section>
<form id="registration">
<label>Name<br><input name="name" required></label>
<label>Password<br><input name="password" type="password" minlength="6" required></label>
<label>Age<br><input name="age" type="number" min="1" max="120" required></label>
<label>Mobile<br><input name="mobile" pattern="[0-9]{10}" required></label>
<label>Email<br><input name="email" type="email" required></label>
<p>Gender <label><input type="radio" name="gender" value="Male" required> Male</label>
<label><input type="radio" name="gender" value="Female"> Female</label>
<label><input type="radio" name="gender" value="Other"> Other</label></p>
<label>State <select name="state" required><option value="">Choose state</option>
<option>Kerala</option><option>Tamil Nadu</option><option>Karnataka</option><option>Maharashtra</option>
</select></label><p>Skills
<label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
<label><input type="checkbox" name="skills" value="Python"> Python</label>
<label><input type="checkbox" name="skills" value="C++"> C++</label>
<label><input type="checkbox" name="skills" value="Java"> Java</label></p>
<button>Save registration</button></form><output id="status">All fields are mandatory.</output>
<table id="details"></table></section></main>
<script>
document.querySelector('form').addEventListener('submit', async event => {
  event.preventDefault();
  const form = new FormData(event.target);
  if (!form.getAll('skills').length) {
    document.querySelector('#status').textContent = 'Select at least one skill.'; return;
  }
  const button = event.target.querySelector('button'); button.disabled = true;
  try {
    const response = await fetch('/api/registration', {
      method: 'POST', body: new URLSearchParams(form)
    });
    const saved = await response.json();
    if (!response.ok) throw new Error(saved.message);
    const table = document.querySelector('#details'); table.replaceChildren();
    for (const [key, value] of Object.entries(saved)) {
      const row = table.insertRow();
      row.insertCell().textContent = key;
      row.insertCell().textContent = Array.isArray(value) ? value.join(', ') : value;
    }
    document.querySelector('#status').textContent = 'Registration stored in MongoDB.';
    event.target.elements.password.value = '';
  } catch (error) { document.querySelector('#status').textContent = error.message; }
  finally { button.disabled = false; }
});
</script></body></html>
